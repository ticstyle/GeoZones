name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # =======================================================
  # JOB 1: Sync Translations & Code Formatting (Linter)
  # =======================================================
  sync_and_format:
    name: Sync Translations & Format Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MY_WORKFLOW_SECRET }}
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Copy strings.json to translations/en.json
        run: |
          mkdir -p custom_components/*/translations
          cp custom_components/*/strings.json custom_components/*/translations/en.json

      - name: Run Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix custom_components"

      - name: Run Ruff Format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format custom_components"

      - name: Commit & Push changes if needed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync translations and auto-format with Ruff"
          file_pattern: "custom_components/*/translations/en.json custom_components/**"

  # ==========================================
  # JOB 2: Parallel Validation Check Suites
  # ==========================================
  hassfest:
    name: Run Hassfest
    needs: sync_and_format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: Run HACS Check
    needs: sync_and_format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  mypy:
    name: Type Checking
    needs: sync_and_format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Cache Mypy internal analysis
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Install Mypy & Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Mypy
        run: mypy custom_components

  # ==========================================
  # JOB 3: Autopublish GitHub Releases
  # ==========================================
  release:
    name: Create GitHub Release
    needs: [hassfest, hacs, mypy]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version and determine release type
        id: get_version
        run: |
          VERSION=$(jq -r '.version' custom_components/*/manifest.json)
          BRANCH="${{ github.ref_name }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Evaluating release for v$VERSION on branch '$BRANCH'"

          IS_TAG_PRERELEASE=false
          if [[ "$VERSION" =~ alpha|beta|rc|dev ]]; then
            IS_TAG_PRERELEASE=true
          fi

          if [[ "$BRANCH" != "main" ]]; then
            # Non-main branches are ALWAYS pre-releases
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            
            # Block release if a non-main branch tries to publish a stable version number without a pre-release tag
            if [[ "$IS_TAG_PRERELEASE" == "false" ]]; then
              echo "SHOULD_RELEASE=false" >> $GITHUB_OUTPUT
              echo "Stable version number found on non-main branch '$BRANCH'. Skipping release to prevent accidental production publishing."
            else
              echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
            fi
          else
            # Main branch uses the manifest tag to determine pre-release vs stable
            echo "IS_PRERELEASE=$IS_TAG_PRERELEASE" >> $GITHUB_OUTPUT
            echo "SHOULD_RELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if Git Tag already exists
        id: check_tag
        if: steps.get_version.outputs.SHOULD_RELEASE == 'true'
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build GitHub Release
        if: steps.get_version.outputs.SHOULD_RELEASE == 'true' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE == 'true' }}
